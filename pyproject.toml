[project]
name = "bondi-empty-project"
authors = [{ name = "Thomas Rueckstiess", email = "thomas@relcon.ai" }]
version = "0.2.0"
description = "A starting point for reproducible document database experiments with BONDI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "yanex>=0.7.0",
    "pandas>=3.1.0",
    "matplotlib>=3.11.2",
    "ipykernel>=7.4.0",
    "bondi>=0.4.0,<0.5.0",
]

[project.scripts]
empty-cli = "empty_project._cli:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/empty_project"]

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]
docs = ["relcon-docs>=0.1.7,<1.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
